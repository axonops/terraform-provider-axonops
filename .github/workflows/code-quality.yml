name: Code Quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true
      # The prebuilt golangci-lint binary is built with an older Go and cannot
      # read export data from the Go 1.27 toolchain; build it with the
      # runner's Go instead. v2 requires golangci-lint-action v7 or later.
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.15.0
          install-mode: goinstall
          args: --timeout=5m

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
      - name: Check code formatting
        run: |
          if [ "$(gofmt -s -l . | wc -l)" -gt 0 ]; then
            echo "Code formatting issues found:"
            gofmt -s -d .
            exit 1
          fi
